name: '🚀 Publish Plugin'

permissions:
  contents: write

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release to rebuild from the current main branch
        required: true
        type: string

jobs:
  build-and-publish:
    name: Publish ${{ matrix.name }} build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Jellyfin 10.11
            framework: net9.0
            dotnet: 10.0.x
            suffix: jf10.11
          - name: Jellyfin 12
            framework: net10.0
            dotnet: 10.0.x
            suffix: jf12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || 'main' }}

      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="$(gh release view "$RELEASE_TAG_INPUT" --json tagName --jq .tagName)"
          fi
          if [ -z "$release_tag" ]; then
            echo "No GitHub release found for '$RELEASE_TAG_INPUT'. Enter the exact existing release tag." >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Select .NET 10 SDK
        run: |
          sed -i 's/"version": "9.0.100"/"version": "10.0.100"/' global.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Select Jellyfin 12 build metadata
        if: matrix.framework == 'net10.0'
        run: cp build-jf12.yaml build.yaml

      - name: Build Jellyfin plugin
        id: jprm
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d
        with:
          dotnet-target: ${{ matrix.framework }}

      - name: Upload package and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PACKAGE: ${{ steps.jprm.outputs.artifact }}
          PACKAGE_SUFFIX: ${{ matrix.suffix }}
        run: |
          package="${PACKAGE%.zip}_${PACKAGE_SUFFIX}.zip"
          mv "$PACKAGE" "$package"
          md5sum "$package" > "$package.md5"
          sha256sum "$package" > "$package.sha256"
          gh release upload "$RELEASE_TAG" \
            "$package" "$package.md5" "$package.sha256" \
            --clobber

  update-manifests:
    name: Update plugin manifests
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download release packages and metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$RELEASE_TAG" \
            --pattern '*.zip' \
            --dir "$RUNNER_TEMP/release"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/release.json"

      - name: Update Jellyfin 10.11 and Jellyfin 12 manifests
        env:
          RELEASE_JSON: ${{ runner.temp }}/release.json
          RELEASE_DIRECTORY: ${{ runner.temp }}/release
        run: python3 .github/scripts/update_manifest.py "$RELEASE_JSON" "$RELEASE_DIRECTORY"

      - name: Commit and publish manifests
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json manifest-jf12.json
          if git diff --cached --quiet; then
            echo "Plugin manifests are already up to date."
            exit 0
          fi
          git commit -m "Update plugin manifests for $RELEASE_TAG"
          git push origin HEAD:main
