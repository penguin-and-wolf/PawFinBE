name: '🚀 Publish Plugin'

permissions:
  contents: write

on:
  release:
    types:
      - released
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to build and publish
        required: true
        type: string

jobs:
  call:
    if: github.event_name == 'release'
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/publish.yaml@master
    with:
      version: ${{ github.event.release.tag_name || github.ref_name }}
      is-unstable: ${{ github.event.release.prerelease || false }}
      dotnet-version: "9.0.x"
      dotnet-target: "net9.0"
    secrets:
      deploy-host: ${{ secrets.DEPLOY_HOST }}
      deploy-user: ${{ secrets.DEPLOY_USER }}
      deploy-key: ${{ secrets.DEPLOY_KEY }}

  manual-publish:
    name: Build and publish selected release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve and fetch selected release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          resolved_tag="$(gh release view "$RELEASE_TAG" --json tagName --jq .tagName)"
          if [ -z "$resolved_tag" ]; then
            echo "No GitHub release found for '$RELEASE_TAG'. Enter the exact existing release tag." >&2
            exit 1
          fi
          git fetch --depth=1 origin "refs/tags/$resolved_tag:refs/tags/$resolved_tag"
          git checkout --detach "$resolved_tag"
          echo "tag=$resolved_tag" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build Jellyfin plugin
        id: jprm
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d
        with:
          dotnet-target: net9.0

      - name: Upload package and checksums to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PACKAGE: ${{ steps.jprm.outputs.artifact }}
        run: |
          md5sum "$PACKAGE" > "$PACKAGE.md5"
          sha256sum "$PACKAGE" > "$PACKAGE.sha256"
          gh release upload "$RELEASE_TAG" \
            "$PACKAGE" "$PACKAGE.md5" "$PACKAGE.sha256" \
            --clobber

  update-manifest:
    name: Update plugin repository manifest
    needs: [call, manual-publish]
    if: >-
      always() &&
      ((github.event_name == 'release' && github.event.action == 'released' && needs.call.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && needs.manual-publish.result == 'success'))
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Read plugin build metadata
        id: metadata
        run: |
          ruby -ryaml -e '
            metadata = YAML.safe_load(File.read("build.yaml"))
            File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |output|
              output.puts "version=#{metadata.fetch("version")}"
              output.puts "targetAbi=#{metadata.fetch("targetAbi")}"
            end
          '

      - name: Download release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$RELEASE_TAG" \
            --pattern '*.zip' \
            --dir "$RUNNER_TEMP/release"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/release.json"

      - name: Update manifest
        env:
          PLUGIN_VERSION: ${{ steps.metadata.outputs.version }}
          TARGET_ABI: ${{ steps.metadata.outputs.targetAbi }}
        run: |
          python3 .github/scripts/update_manifest.py \
            "$RUNNER_TEMP/release.json" \
            "$RUNNER_TEMP/release"

      - name: Publish manifest update
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "Manifest is already up to date."
            exit 0
          fi
          git commit -m "Update plugin manifest for ${{ steps.metadata.outputs.version }}"
          git push origin "HEAD:$DEFAULT_BRANCH"
